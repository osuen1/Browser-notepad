<!-- Фоновая графика, как на странице регистрации -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/style-register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <title>Сброс пароля</title>
</head>
<body>
<div class="background-art">
    <div class="sun"></div>
    <div class="mountain"></div>
</div>

<!-- Форма сброса пароля -->
<div class="register-container password-reset-container">
    <h2>Сброс пароля</h2>

    <div class="form-group">
        <label for="resetEmail">Ваша электронная почта</label>
        <input type="email" id="resetEmail" class="input-field" placeholder="example@mail.com">
    </div>

    <div class="form-group">
        <label for="newPassword">Новый пароль</label>
        <div class="password-wrapper">
            <input type="password" id="newPassword" class="input-field">
            <i class="fas fa-eye toggle-password" data-target="newPassword"></i>
        </div>
    </div>

    <div class="form-group">
        <label for="confirmNewPassword">Повторите новый пароль</label>
        <div class="password-wrapper">
            <input type="password" id="confirmNewPassword" class="input-field">
            <i class="fas fa-eye toggle-password" data-target="confirmNewPassword"></i>
        </div>
    </div>

    <button class="register-btn" onclick="resetPassword()">Сбросить пароль</button>
    <div id="resetMessage" class="message" style="margin-top: 20px; font-size: 14px; text-align: center;"></div>
</div>

<script src="/assets/reset-password-script.js"></script>

</body>

</html>

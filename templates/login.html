<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="assets/style-login.css">
</head>

<body>
    <!-- Фоновая графика -->
    <div class="background-art">
        <div class="sun"></div>
        <div class="mountain"></div>
    </div>

    <!-- Логин форма -->
    <div class="login-container">
        <h2>Login</h2>
        <input type="text" id="username" class="input-field" placeholder="Username">
        <input type="password" id="password" class="input-field" placeholder="Password">

        <div class="remember-forgot">
            <label class="remember-label">
                <div class="toggle-switch">
                    <input type="checkbox" id="remember">
                    <span class="slider"></span>
                </div>
                remember me
            </label>
            <a href="create-account.html" class="forgot-link">forgot password</a>
        </div>

        <button id="loginBtn" class="login-btn", onclick="login()">Login</button>
        <div class="create-account">
            Create Account <a href="#">here</a>
        </div>
    </div>
    <script src="assets/login-script.js"></script>
</body>

</html>

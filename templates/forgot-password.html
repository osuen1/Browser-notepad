<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля</title>
    <!-- Подключаем тот же файл стилей для сохранения общего вида -->
    <link rel="stylesheet" href="/assets/style-forgot-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>
    <!-- Фоновая графика, как на странице регистрации -->
    <div class="background-art">
        <div class="sun"></div>
        <div class="mountain"></div>
    </div>

    <!-- Форма восстановления пароля -->
    <div class="forgot-password-container">
        <h2>Восстановление пароля</h2>
        <p class="description-text">
            Пожалуйста, введите вашу электронную почту, и мы отправим вам ссылку для сброса пароля.
        </p>

        <div class="form-group">
            <label for="email">Электронная почта</label>
            <input type="email" id="email" class="input-field" placeholder="example@mail.com">
        </div>

        <button class="forgot-password-btn" onclick="sendResetLink()">Отправить ссылку для восстановления</button>

        <div class="back-to-login">
            <a href="login">Вернуться ко входу</a>
        </div>
    </div>
    <script src="/assets/script-forgot-password.js"></script>
</body>

</html>

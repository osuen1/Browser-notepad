<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/assets/style-register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Фоновая графика -->
    <div class="background-art">
        <div class="sun"></div>
        <div class="mountain"></div>
    </div>

    <!-- Форма регистрации -->
    <div class="register-container">
        <h2>Регистрация нового пользователя</h2>

        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" class="input-field" placeholder="">
        </div>


        <div class="form-group">
            <label for="email">Электронная почта</label>
            <input type="email" id="email" class="input-field" placeholder="example@mail.com">
        </div>

        <div class="form-group">
            <label for="password">Придумайте пароль</label>
            <div class="password-wrapper">
                <input type="password" id="password" class="input-field">
                <i class="fas fa-eye toggle-password" data-target="password"></i>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Повторите пароль</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" class="input-field">
                <i class="fas fa-eye toggle-password" data-target="confirmPassword"></i>
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="agree">
            <label for="agree">Я принимаю согласие на обработку персональных данных</label>
        </div>

        <button class="register-btn" onclick="register()">Зарегистрироваться</button>
        <!-- Кнопка для возврата на страницу входа -->
        <a href="login.html" class="login-btn">Уже есть аккаунт? Войти</a>
    </div>

    <script src="/assets/register-script.js"></script>
</body>

</html>
